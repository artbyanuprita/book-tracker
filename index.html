<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book Tracker</title>
<meta name="theme-color" content="#8A3B22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Book Tracker">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* BOOK TRACKER · TRACKER PAGE (hosted on your own website)
   Colours come from Settings (theme_*). Everything else is generic. */
:root{--geru:#8A3B22;--cream:#F5EFE2;--card:#FFFBF3;--ink:#2A2623;--muted:#5E554D;--line:#D8CBB6;--soft:#F1E1D3;--amber:#8A5300;--amberbg:#FFF7E8;--red:#A3241B;--redbg:#FDF1EF;--green:#2F5A2B;--greenbg:#E3EEDF}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Mukta',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--geru)}
:focus-visible{outline:3px solid #C98F6E;outline-offset:2px}
.hidden{display:none!important}

/* Header (pinned) */
.top{position:sticky;top:0;z-index:20;background:var(--cream)}
.border{display:block;width:100%;height:12px}
.hdr{max-width:1440px;margin:0 auto;padding:6px max(14px,env(safe-area-inset-left)) 4px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 150px}
.hdr{flex-wrap:wrap}.hright{margin-left:auto}
@media (max-width:520px){.lbl{display:none}}
.icon{width:36px;height:36px;border-radius:10px;background:var(--geru);display:flex;align-items:center;justify-content:center;flex:none}
.title{font-size:18px;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subtitle{display:none;font-size:15px;color:var(--muted)}
.hi{font-size:13px;color:var(--muted)}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.hrow{display:flex;align-items:center;gap:8px}
.date{font-size:13px;font-weight:700}
.pill{min-height:32px;padding:0 10px;border-radius:999px;border:1.5px solid var(--geru);background:var(--card);color:var(--geru);font-weight:700;font-size:13px}
.meetbar{max-width:1440px;margin:0 auto 6px;padding:0 max(14px,env(safe-area-inset-left))}
.meetin{background:var(--ink);color:var(--cream);border-radius:12px;padding:4px 6px 4px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.meetin>div{min-width:0}
.meetin small{display:block;font-size:11px;color:#D8CBB6}
.meetin b{display:block;font-size:13px;line-height:1.3}
.joinS{min-height:32px;padding:0 12px;border-radius:10px;background:var(--cream);color:var(--ink);font-weight:800;font-size:15px;display:flex;align-items:center;text-decoration:none;flex:none}
.nav{max-width:1440px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-left))}
.phases{display:none;gap:10px;align-items:center;padding:4px 0 8px}
.p1{min-height:44px;padding:0 20px;border-radius:14px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
.p1 small{font-weight:500;font-size:14px;color:var(--muted)}
.p1.on{background:var(--ink);color:var(--cream)}.p1.on small{color:var(--line)}
.tabs{display:flex;gap:6px;padding:0 0 6px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.t2{flex:none;min-height:34px;padding:0 12px;border-radius:999px;border:1.5px solid var(--geru);background:var(--card);color:var(--geru);font-weight:600;font-size:14px}
.t2.on{background:var(--geru);color:var(--card)}

/* Page */
.wrap{max-width:1440px;margin:0 auto;padding:10px max(14px,env(safe-area-inset-left)) 110px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.h2{margin:0;font-size:18px;font-weight:800}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
.note{background:#FBEBD0;border:1px solid #E8C990;color:#5E3A00;border-radius:12px;padding:10px 12px;font-size:14px}
.fld{min-height:44px;border-radius:10px;border:1px solid #CBBDA6;background:var(--card);padding:0 12px;font-size:16px;min-width:0}
textarea.fld{padding:10px 12px;min-height:80px;resize:vertical;width:100%}
.fld.grow{flex:1 1 200px}
.btn{min-height:44px;padding:0 20px;border-radius:999px;border:none;background:var(--ink);color:var(--cream);font-weight:700;font-size:15px}
.btn2{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--geru);background:var(--card);color:var(--geru);font-weight:600;font-size:14px}
.btn2.red{border-color:var(--red);color:var(--red)}
.btn2.on{background:var(--geru);color:var(--card)}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:7px;padding:2px 7px;background:#EFE7DA;white-space:nowrap}
.tk{background:var(--soft);color:#5E2715}.dl{background:#FBEBD0;color:var(--amber)}.ok{background:var(--greenbg);color:var(--green)}.wt{background:#E2EAF3;color:#2F5D8A}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigb{min-height:60px;border-radius:14px;border:1.5px solid var(--ink);background:var(--card);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.help{border:1.5px solid var(--red);background:#FBE9E6;border-radius:12px;padding:10px 12px}
.help b{font-size:12px;letter-spacing:.06em;color:var(--red);text-transform:uppercase}
.who{margin:10px 0 0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--geru)}
.ck{display:flex;align-items:center;gap:12px;min-height:50px;padding:4px 0;border-bottom:1px solid #E9DFCF;font-size:16px}
.ck:last-child{border-bottom:none}
.ck input{width:26px;height:26px;accent-color:var(--geru);flex:none;margin:0}
.ck .txt{flex:1;min-width:0}
.strike{color:var(--muted);text-decoration:line-through}
.due{font-size:13px;color:var(--muted);white-space:nowrap}
.over{color:var(--amber);font-weight:700}
.pr{display:flex;align-items:center;gap:10px;font-size:14px;min-height:30px}
.barx{height:8px;border-radius:999px;background:#E9DFCF;overflow:hidden;flex:1}
.barx i{display:block;height:100%;background:var(--geru)}
.tiles{display:none;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column}
.tl{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.tv{font-size:28px;font-weight:800;line-height:1.1}
.cols{display:flex;flex-direction:column;gap:12px}
.grid3{display:grid;grid-template-columns:1fr;gap:10px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.tcard.overc{border-color:#D99A2B;background:var(--amberbg)}
.tcard.stuck{border:1.5px solid var(--red);background:var(--redbg)}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.stucknote{color:var(--red);font-weight:600;font-size:14px}
.recent{font-size:14px;padding:6px 0;border-bottom:1px dashed #E3D7C3}
.recent:last-child{border-bottom:none}
.meet{background:var(--ink);color:var(--cream);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.joinB{min-height:56px;border-radius:12px;background:var(--cream);color:var(--ink);font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.tz{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.tz div{background:rgba(255,255,255,.08);border-radius:10px;padding:6px 4px;font-size:13px}
.tz b{display:block;font-size:16px}
.sb{min-height:84px;border-radius:16px;border:1.5px solid var(--ink);background:var(--card);font-weight:700;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}

/* Book Map */
.bmitem .stg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:2px 0 10px}
.bmitem+.bmitem{border-top:1px solid #E9DFCF}
.bmrow{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto 40px 14px;gap:8px;align-items:center;background:none;border:none;padding:2px 0;text-align:left;min-height:46px}
.bmrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;gap:2px}.seg i{width:9px;height:16px;border-radius:3px;background:#E9DFCF}.seg i.ip{background:#E6B89C}.seg i.dn{background:var(--geru)}
.tmeta{display:block;font-size:12px;color:var(--muted);text-decoration:none}
.rec{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#FBE4DC;border:1.5px solid var(--geru);border-radius:14px;padding:10px 12px;font-weight:700}
.rec .dot{width:12px;height:12px;border-radius:50%;background:#C0392B;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.shr{display:flex;align-items:center;gap:10px}.shr img{width:56px;height:56px;object-fit:cover;border-radius:10px;flex:none;background:var(--line)}
.shr .shi{width:56px;height:56px;border-radius:10px;flex:none;background:#F1E7D6;display:flex;align-items:center;justify-content:center;font-size:24px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid4 .sb{min-height:70px;font-size:13px;padding:0 2px}
.cell{position:relative;min-height:44px;border-radius:10px;border:1px solid var(--line);background:#FFFDF8;font-size:12px;font-weight:600;color:var(--muted);padding:2px;line-height:1.15;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cell.ip{background:#E6B89C;border-color:#C98F6E;color:#5E2715}
.cell.dn{background:var(--geru);border-color:var(--geru);color:var(--card)}
.cell.hasc::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:#2F5D8A;border:1px solid #fff}
.bmlist{display:block;padding:4px 12px}
.bmgrid{display:none;overflow-x:auto}
.bmt{display:grid;gap:6px;align-items:center;font-size:14px;min-width:900px}
.bmt .cell{min-height:34px}
.sect{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--geru);margin-top:6px}
.thd{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}

/* Bottom sheet */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));min-height:56px;padding:0 20px;border-radius:999px;border:none;background:var(--geru);color:var(--card);font-weight:800;font-size:16px;box-shadow:0 6px 16px rgba(138,59,34,.35);z-index:25}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--cream);border-radius:20px 20px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));z-index:31;transform:translateY(105%);transition:transform .22s}
body.sheet-open .sheetbg{display:block}
body.sheet-open .sheet{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:#CBBDA6;margin:0 auto 8px}
.lab{font-size:13px;font-weight:700;color:var(--muted);display:block;margin:10px 0 4px}
.sheet .fld{width:100%}
.sheetbtns{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:16px}
.sheetbtns .btn{min-height:52px;font-size:17px}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--ink)}
.del{margin-top:12px;width:100%;min-height:44px;border-radius:12px;border:1.5px solid var(--red);background:transparent;color:var(--red);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:92vw;background:var(--green);color:#fff;font-weight:700;padding:10px 18px;border-radius:999px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
.toast.show{opacity:1}
.undo{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:41;display:none;align-items:center;gap:14px;background:var(--ink);color:var(--cream);font-weight:700;padding:6px 6px 6px 18px;border-radius:999px;box-shadow:0 6px 16px rgba(0,0,0,.25);max-width:92vw}
.undo.show{display:flex}
.undo button{min-height:40px;padding:0 16px;border-radius:999px;border:none;background:var(--cream);color:var(--ink);font-weight:800}.toast.err{background:var(--red);border-radius:14px}.toast.busy{background:var(--ink)}
.sw{min-height:40px;min-width:64px;border-radius:999px;border:1.5px solid var(--ink);font-weight:700;font-size:13px}
.sw.on{background:#3F6B3A;border-color:#3F6B3A;color:var(--card)}.sw.off{background:var(--card);color:var(--muted)}
.lrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #E9DFCF}

/* Laptop */
@media (min-width:900px){
  .whofoot{padding-right:14px}
  .icon{width:52px;height:52px;border-radius:14px}
  .title{font-size:28px}
  .subtitle{display:block}
  .hi,.date{font-size:15px}
  .phases{display:flex}
  .meetin small{display:block}.meetin b{font-size:14px}.joinS{min-height:38px}
  .tabs{flex-wrap:wrap;padding-bottom:12px}
  .t2{min-height:40px;padding:0 16px;font-size:15px}
  .wrap{padding-top:16px;gap:16px}
  .tiles{display:grid}
  .cols{flex-direction:row;align-items:flex-start}
  .cols>.main{flex:2 1 0;min-width:0}.cols>.side{flex:1 1 0;min-width:0}
  .grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .bmlist{display:none}.bmgrid{display:block}
  .fab{display:none}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:560px;border-radius:20px;transform:translate(-50%,-40%);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
  body.sheet-open .sheet{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Sign-in screen */
#gate{position:fixed;inset:0;z-index:50;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#gate .gicon{width:96px;height:96px;border-radius:22px;box-shadow:0 6px 18px rgba(0,0,0,.15)}
#gate h1{margin:0;font-size:26px;font-weight:800}
#gate p{margin:0;max-width:360px;color:var(--muted);line-height:1.45}
#gateMsg{min-height:24px;font-weight:600;color:var(--ink)}
#gateMsg.err{color:var(--red)}
#gbtn{min-height:44px}
.whofoot{max-width:1440px;margin:0 auto;padding:0 150px 120px max(14px,env(safe-area-inset-left));font-size:13px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.whofoot button{border:none;background:none;color:var(--geru);font-weight:700;text-decoration:underline;min-height:40px;padding:0 4px}
</style>
</head>
<body>
<div id="gate" role="dialog" aria-label="Sign in">
  <img class="gicon" src="icon-192.png" alt="">
  <h1 id="gateTitle">Book Tracker</h1>
  <p>Sign in with the Google account (Gmail) you gave the team.<br><span lang="hi">टीम को दिए गए अपने Google खाते (Gmail) से साइन इन करें।</span></p>
  <div id="gbtn" class="hidden"></div>
  <div id="gateMsg" role="status" aria-live="polite"></div>
</div>

<header class="top">
  <svg class="border" aria-hidden="true"><defs><pattern id="wp" width="22" height="12" patternUnits="userSpaceOnUse"><circle cx="11" cy="2.4" r="1.6" fill="#F5EFE2"/><path d="M8 4.4 L14 4.4 L11 7.2 Z M11 7.2 L8 10.2 L14 10.2 Z" fill="#F5EFE2"/></pattern></defs><rect width="100%" height="12" fill="#8A3B22"/><rect width="100%" height="12" fill="url(#wp)"/></svg>
  <div class="hdr">
    <div class="brand">
      <div class="icon"><svg width="60%" height="60%" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="4.5" r="2.6" fill="#F5EFE2"/><path d="M7.5 8.5 L18.5 8.5 L13 13.5 Z M13 13.5 L7.5 19 L18.5 19 Z" fill="#F5EFE2"/><path d="M10 19 L8.5 24 M16 19 L17.5 24 M8.5 10 L4 7 M17.5 10 L22 7" stroke="#F5EFE2" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg></div>
      <div style="min-width:0"><div class="title" id="hTitle"></div><div class="subtitle" id="hSub"></div><div class="hi" id="hHi"></div></div>
    </div>
    <div class="hright">
      <div class="hrow"><span class="date" id="hDate"></span></div>
      <div class="hrow"><button class="pill" data-act="feedback" id="hFeedback">💬</button><button class="pill" data-act="refresh" id="hRefresh" aria-label="Refresh">↻</button><button class="pill" data-act="lang" id="hLang"></button></div>
    </div>
  </div>
  <div class="meetbar"><div class="meetin"><div><small id="mLabel"></small><b id="mWhen"></b></div><a class="joinS" id="mJoin" target="_blank" rel="noopener"></a></div></div>
  <nav class="nav"><div class="phases" id="phases"></div><div class="tabs" id="tabs" role="tablist"></div></nav>
</header>
<main class="wrap" id="main"></main>
<div class="whofoot" id="whoFoot"></div>
<button class="fab" id="fab" data-act="newTask"></button>
<div class="sheetbg" data-act="closeSheet"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="undo" id="undo" role="status" aria-live="polite"><span id="undoText"></span><button type="button" id="undoBtn"></button></div>

<script>
// ───────── SETTINGS FOR THIS PAGE: fill in these two lines ─────────
var CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbzI7ra26GrrYqoOo7lPuydwfv8lOLD1Sk5Nkf8KLYFeRgCB9kHgLi1ODD9q4Ex055lu/exec',     // ends in /exec
  CLIENT_ID: '976890435309-584bk0qnavs8k6gqhkfp31lbdpensie0.apps.googleusercontent.com',          // ends in .apps.googleusercontent.com
  TITLE: 'Book Tracker'
};

// ───────── Sign-in and server calls ─────────
function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function stored(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function gid(id) { return document.getElementById(id); }

function api(action, extra) {
  var body = { action: action, session: stored('bt_session') };
  if (extra) for (var k in extra) body[k] = extra[k];
  return fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(body) })
    .then(function (r) { if (!r.ok) throw new Error('No connection to the tracker (' + r.status + '). Check your internet.'); return r.json(); })
    .then(function (j) {
      if (!j.ok) { var e = new Error(j.error); e.code = j.code; e.email = j.email; if (j.code === 'signin') showGate('expired'); throw e; }
      return j.data;
    });
}

var started = false;
function gateText(msg, isErr) { var m = gid('gateMsg'); m.textContent = msg || ''; m.className = isErr ? 'err' : ''; }
// Last data the server sent, kept on this device so the page opens at once next time.
function saveBoot(b) { try { if (b) store('bt_boot', JSON.stringify(b)); } catch (e) {} }
function cachedBoot() {
  try {
    var b = JSON.parse(stored('bt_boot') || 'null');
    if (b && b.me && b.me.email && b.me.email === stored('bt_email')) { b.__cached = true; return b; }
  } catch (e) {}
  return null;
}
function showGate(reason) {
  store('bt_session', null); store('bt_boot', null);
  gid('gate').classList.remove('hidden');
  gid('gbtn').classList.remove('hidden');
  if (reason === 'expired') gateText('Please sign in again. · कृपया फिर से साइन इन करें।');
}
function gisReady() {

// ───────── Share: pick files, record voice, send to Drive ─────────
var SHARE_MAX = 30 * 1024 * 1024, REC = null, recTimer = null;
function recClock() { if (!REC) return '0:00'; var s = Math.floor((Date.now() - REC.start) / 1000); return Math.floor(s / 60) + ':' + pad(s % 60); }
function keepShareInputs() { if ($('shUnit')) S.shUnit = $('shUnit').value; if ($('shCap')) S.shCap = $('shCap').value; }
function goShare(el) { if (el && el.dataset && el.dataset.go && S.tab !== 'share') { S.tab = 'share'; var tb = B.tabs.filter(function (x) { return x.id === 'share'; })[0]; if (tb && tb.phase) S.phase = tb.phase; window.scrollTo(0, 0); render(); } }
function toB64(blob) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result).split(',')[1] || ''); }; r.onerror = function () { rej(new Error('Could not read the file.')); }; r.readAsDataURL(blob); }); }
function shrinkPhoto(file) {
  var max = +B.settings.photo_max_px || 2000;
  if (!/^image\/(jpeg|png|webp)$/i.test(file.type)) return Promise.resolve({ blob: file, name: file.name });
  return new Promise(function (res) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      if (k === 1 && file.size < 1500000) { URL.revokeObjectURL(url); res({ blob: file, name: file.name }); return; }
      var c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(function (b) { res(b ? { blob: b, name: String(file.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg' } : { blob: file, name: file.name }); }, 'image/jpeg', 0.85);
    };
    img.onerror = function () { URL.revokeObjectURL(url); res({ blob: file, name: file.name }); };
    img.src = url;
  });
}
function sendBlob(blob, name, kind, n, total) {
  if (blob.size > SHARE_MAX) { toast(t('share.too_big', 'This file is over 30 MB. Please send it through Drive or WhatsApp.') + ' (' + name + ')', 'err', 7000); return Promise.resolve(); }
  toast(t('share.sending', 'Sending…') + (total > 1 ? ' ' + n + '/' + total : '') + ' · ' + name, 'busy');
  return toB64(blob).then(function (b64) {
    return run('appShare', { type: kind, name: name, mime: blob.type || 'application/octet-stream', data: b64, unit: S.shUnit, caption: S.shCap });
  }).then(function (row) {
    B.shared = [row].concat(B.shared || []); logLocal('added', 'SharedItems', name);
    if (n === total) { S.shCap = ''; toast(t('share.sent', 'Sent ✓'), 'ok'); }
    render();
  }, fail);
}
function pickFiles(kind) {
  var inp = document.createElement('input'); inp.type = 'file';
  inp.accept = kind === 'photo' ? 'image/*' : kind === 'video' ? 'video/*' : '';
  inp.multiple = kind !== 'video';
  inp.style.display = 'none'; document.body.appendChild(inp);
  inp.onchange = function () {
    var files = Array.prototype.slice.call(inp.files || []); inp.remove(); if (!files.length) return;
    var chain = Promise.resolve();
    files.forEach(function (f, i) {
      chain = chain.then(function () {
        var k = kind === 'file' && /^image\//.test(f.type) ? 'photo' : kind;
        return (k === 'photo' ? shrinkPhoto(f) : Promise.resolve({ blob: f, name: f.name })).then(function (x) { return sendBlob(x.blob, x.name || k, k, i + 1, files.length); });
      });
    });
  };
  inp.click();
}
function startVoice() {
  if (REC) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) { toast(t('share.no_mic', 'This browser cannot record. Record in your phone\'s recorder app and send it with File.'), 'err', 7000); return; }
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
    var mime = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/aac'].filter(function (m) { return MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m); })[0] || '';
    var mr; try { mr = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream); } catch (e) { mr = new MediaRecorder(stream); }
    REC = { mr: mr, chunks: [], stream: stream, start: Date.now(), cancel: false };
    mr.ondataavailable = function (e) { if (e.data && e.data.size) REC.chunks.push(e.data); };
    mr.onstop = function () {
      var r = REC; REC = null; clearInterval(recTimer); r.stream.getTracks().forEach(function (tr) { tr.stop(); }); render();
      if (r.cancel || !r.chunks.length) return;
      var type = (mr.mimeType || mime || 'audio/webm').split(';')[0];
      var ext = /mp4|aac|m4a/.test(type) ? 'm4a' : 'webm';
      sendBlob(new Blob(r.chunks, { type: type }), 'Voice note.' + ext, 'voice', 1, 1);
    };
    mr.start(1000);
    recTimer = setInterval(function () { var el = $('recTime'); if (el) el.textContent = recClock(); if (REC && Date.now() - REC.start > 15 * 60 * 1000) REC.mr.stop(); }, 500);
    render();
  }, function () { toast(t('share.mic_denied', 'Please allow the microphone for this site, then try again.'), 'err', 7000); });
}

// ───────── Sheets (forms) ─────────
function openSheet(html) { $('sheet').innerHTML = '<div class="grab"></div>' + html; document.body.classList.add('sheet-open'); S.sheetOpen = true; S.confirmDel = false; var f = $('sheet').querySelector('textarea,input'); if (f && wide()) f.focus(); }

function unitPairs() { return B.units.map(function (u) { return [u['Unit ID'], (u['Short name'] || '') + ' · ' + u['Name']]; }); }
function sheetButtons(delAct, id) {

}

    '<div><label class="lab" for="fStatusS">' + esc(t('field.status')) + '</label>' + sel('fStatusS', listItems('task_status').map(function (x) { return [x.id, t(x.key, x.id)]; }), r['Status'] || 'todo') + '</div></div>' +

}
function ideaSheet(id, preset) {

function stuckSheet(id) {

function commentSheet(unitId, stageId) {
  var c = cellOf(unitId, stageId) || {}; var st = B.stages.filter(function (x) { return x['Stage ID'] === stageId; })[0];
  openSheet('<h2 class="h2">' + esc(unitShort(unitId)) + ' · ' + esc(st ? stageLabel(st) : stageId) + '</h2>' +

    '<label class="lab" for="cText">' + esc(t('field.comment')) + '</label><textarea class="fld" id="cText">' + esc(c['Comment']) + '</textarea>' +
    (c['Last updated by'] ? '<p class="muted">' + esc(c['Last updated by']) + ' · ' + esc(ago(c['Last updated on'])) + '</p>' : '') +
    '<div class="sheetbtns"><button class="btn ghost" data-act="closeSheet">' + esc(t('btn.cancel')) + '</button><button class="btn" data-act="saveCell" data-unit="' + esc(unitId) + '" data-stage="' + esc(stageId) + '">' + esc(t('btn.save')) + '</button></div>');
}
function val(id) { var el = $(id); return el ? el.value.trim() : ''; }

// ───────── Actions ─────────
function setCell(unitId, stageId, status, comment) {
  var c = cellOf(unitId, stageId);
  var prev = c ? JSON.parse(JSON.stringify(c)) : null;
  if (c) { if (status != null) c['Status'] = status; if (comment != null) c['Comment'] = comment; }
  else B.bookmap.push({ 'Row ID': 'tmp', 'Unit ID': unitId, 'Stage ID': stageId, 'Status': status, 'Comment': comment || '' });
  render(); toast(t('app.saving'), 'busy');
  run('appSetCell', unitId, stageId, status, comment == null ? null : comment).then(function (row) {
    B.bookmap = B.bookmap.filter(function (x) { return !(x['Row ID'] === 'tmp' && x['Unit ID'] === unitId && x['Stage ID'] === stageId); });
    upsert('BookMap', row); logLocal('updated', 'BookMap', unitShort(unitId)); toast(t('msg.saved'), 'ok'); render();
  }, function (e) {
    if (prev) upsert('BookMap', prev); else B.bookmap = B.bookmap.filter(function (x) { return x['Row ID'] !== 'tmp'; });
    fail(e); render();
  });
}
function cycleCell(unitId, stageId) {
  var ids = listItems('cell_status').map(function (x) { return x.id; }); if (!ids.length) ids = ['not_started', 'in_progress', 'done'];
  var c = cellOf(unitId, stageId); var cur = c ? c['Status'] : ids[0];
  setCell(unitId, stageId, ids[(ids.indexOf(cur) + 1) % ids.length], null);
}

var ACT = {
  refresh: function () { refresh(false); },
  lang: function () {
    var langs = B.languages || []; if (!langs.length) return;
    var i = langs.map(function (l) { return l.code; }).indexOf(S.lang);
    S.lang = langs[(i + 1) % langs.length].code; render(); run('appSetLang', S.lang).catch(function () {});
  },
  phase: function (el) { S.phase = +el.dataset.id; var f = visibleTabs().filter(function (x) { return x.phase === S.phase; })[0]; S.tab = f ? f.id : S.tab; window.scrollTo(0, 0); render(); },
  tab: function (el) { S.tab = el.dataset.id; var tb = B.tabs.filter(function (x) { return x.id === S.tab; })[0]; if (tb && tb.phase) S.phase = tb.phase; window.scrollTo(0, 0); render(); },
  pick: function (el) { keepShareInputs(); goShare(el); pickFiles(el.dataset.kind || 'file'); },
  voice: function (el) { keepShareInputs(); goShare(el); startVoice(); },
  voiceStop: function () { keepShareInputs(); if (REC) REC.mr.stop(); },
  voiceCancel: function () { if (REC) { REC.cancel = true; REC.mr.stop(); } },
  coming: function () { toast(t('app.coming'), 'busy', 2500); setTimeout(function () { $('toast').className = 'toast'; }, 2500); },
  myTasks: function () { S.person = B.me.name; S.tab = 'tasks'; S.phase = 1; render(); },
  newTask: function () { taskSheet(null); },
  homeAdd: function () {
    var text = val('hTask'); if (!text) { $('hTask').focus(); return; }
    save('Tasks', { 'Task': text, 'Owner': '', 'Unit': '', 'Status': 'todo' });
  },
  bmToggle: function (el) { S.bmOpen[el.dataset.id] = !S.bmOpen[el.dataset.id]; render(); },
  editTask: function (el) { taskSheet(el.dataset.id); },
  editIdea: function (el) { ideaSheet(el.dataset.id); },
  newIdeaFromShare: function () { ideaSheet(null, {}); },
  closeSheet: closeSheet,
  feedback: function () {
    openSheet('<h2 class="h2">' + esc(t('fb.title', 'Send feedback')) + '</h2>' +
      '<label class="lab" for="fbText">' + esc(t('fb.ph', 'What works, what is confusing, what should change?')) + '</label><textarea class="fld" id="fbText" style="min-height:120px"></textarea>' +
      '<div class="sheetbtns"><button class="btn ghost" data-act="closeSheet">' + esc(t('btn.cancel')) + '</button><button class="btn" data-act="saveFeedback">' + esc(t('btn.save')) + '</button></div>');
  },
  saveFeedback: function () {
    var text = val('fbText'); if (!text) { $('fbText').focus(); return; }
    closeSheet(); toast(t('app.saving'), 'busy');
    run('appSaveRow', 'Feedback', { 'Feedback': text, 'Screen': S.tab, 'Device': (wide() ? 'laptop' : 'phone') + ' · ' + navigator.userAgent.slice(0, 120) })
      .then(function () { toast(t('fb.thanks', 'Thank you! Feedback saved ✓'), 'ok', 2500); }, fail);
  },
  quickAdd: function () {
    var text = val('qTask'); if (!text) { $('qTask').focus(); return; }
    save('Tasks', { 'Task': text, 'Owner': S.person || '', 'Unit': S.unit, 'Status': 'todo' });
  },
  saveTask: function (el) {
    var text = val('fTask'); if (!text) { $('fTask').focus(); return; }
    var obj = { 'Task': text, 'Unit': val('fUnitS'), 'Owner': val('fOwner'), 'Due date': val('fDue'), 'Status': val('fStatusS'), 'Notes': val('fNotes') };

  toggleDone: function (el) {

      if (!done) showUndo(t('msg.done', 'Done ✓'), function () { save('Tasks', { 'Row ID': r['Row ID'], 'Status': prev }); });
    }, function () {});
  },
  stuck: function (el) {
    var r = B.tasks.filter(function (x) { return x['Row ID'] === el.dataset.id; })[0]; if (!r) return;
    if (String(r['Stuck']).toLowerCase() === 'yes') save('Tasks', { 'Row ID': r['Row ID'], 'Stuck': 'no' });
    else stuckSheet(r['Row ID']);
  },
  saveStuck: function (el) {
    var today = todayStr();
    closeSheet(); save('Tasks', { 'Row ID': el.dataset.id, 'Stuck': 'yes', 'Stuck note': val('sNote'), 'Stuck since': today });
  },
  delTask: function (el) { archive('Tasks', el); },
  delIdea: function (el) { archive('Ideas', el); },
  addIdea: function () {
    var text = val('niText'); if (!text) { $('niText').focus(); return; }
    save('Ideas', { 'Idea': text, 'Unit': val('niUnit'), 'Tags': val('niTags') });
  },
  saveIdea: function (el) {
    var text = val('eIdea'); if (!text) { $('eIdea').focus(); return; }
    var obj = { 'Idea': text, 'Unit': val('eUnit'), 'Tags': val('eTags') };
    if (el.dataset.id) obj['Row ID'] = el.dataset.id;
    closeSheet(); save('Ideas', obj);
  },
  ideaToTask: function (el) {
    toast(t('app.saving'), 'busy');
    run('appIdeaToTask', el.dataset.id).then(function (res) {
      upsert('Tasks', res.task); upsert('Ideas', res.idea); logLocal('added', 'Tasks', res.task['Task']);
      toast(t('msg.task_created'), 'ok'); render();
    }, fail);
  },
  cell: function (el) { cycleCell(el.dataset.unit, el.dataset.stage); },
  saveCell: function (el) { var u = el.dataset.unit, s = el.dataset.stage, st = val('cStatus'), c = $('cText').value; closeSheet(); setCell(u, s, st, c); },
  tabVis: function (el) {
    var tb = B.tabs.filter(function (x) { return x.id === el.dataset.id; })[0]; if (!tb) return;
    tb.visible = !tb.visible; render(); toast(t('app.saving'), 'busy');
    run('appSetTabVisible', tb.id, tb.visible).then(function () { toast(t('msg.saved'), 'ok'); }, function (e) { tb.visible = !tb.visible; fail(e); render(); });
  }
};
function archive(tab, el) {
  if (!S.confirmDel) { S.confirmDel = true; el.textContent = t('btn.confirm_delete'); return; }
  var id = el.dataset.id; closeSheet(); toast(t('app.saving'), 'busy');
  run('appArchiveRow', tab, id).then(function () {
    if (tab === 'Tasks') B.tasks = B.tasks.filter(function (x) { return x['Row ID'] !== id; });
    else B.ideas = B.ideas.filter(function (x) { return x['Row ID'] !== id; });
    logLocal('archived', tab, ''); render();
    showUndo(t('msg.deleted'), function () {
      toast(t('app.saving'), 'busy');
      run('appRestoreRow', tab, id).then(function (row) { upsert(tab, row); logLocal('restored', tab, ''); toast(t('msg.restored', 'Restored ✓'), 'ok'); render(); }, fail);
    });
  }, fail);

// ───────── Events ─────────
var pressTimer = null, longPressed = false;
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]'); if (!el) return;
  var a = el.dataset.act;
  if (a === 'filter') return;
  if (a === 'cell' && longPressed) { longPressed = false; return; }
  if (el.tagName === 'INPUT' && el.type === 'checkbox' && a === 'toggleDone') { e.preventDefault(); }
  if (ACT[a]) ACT[a](el, e);
});
document.addEventListener('change', function (e) {
  var id = e.target.id;
  if (id === 'fPerson') S.person = e.target.value;
  else if (id === 'fUnit') S.unit = e.target.value;
  else if (id === 'fStatus') S.status = e.target.value;
  else if (id === 'fDone') S.showDone = e.target.checked;
  else if (id === 'fiPerson') S.ideaPerson = e.target.value;
  else if (id === 'fiUnit') S.ideaUnit = e.target.value;
  else if (id === 'bmOwner') S.bmOwner = e.target.value;
  else if (id === 'bmHide') S.bmHideDone = e.target.checked;
  else return;
  render();
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'bmSearch') {
    S.bmSearch = e.target.value; var pos = e.target.selectionStart; render();
    var f = $('bmSearch'); if (f) { f.focus(); try { f.setSelectionRange(pos, pos); } catch (x) {} }
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && S.sheetOpen) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'qTask') ACT.quickAdd();
  if (e.key === 'Enter' && e.target.id === 'hTask') ACT.homeAdd();
});
document.addEventListener('pointerdown', function (e) {
  var el = e.target.closest('.cell'); if (!el) return;
  longPressed = false; clearTimeout(pressTimer);
  pressTimer = setTimeout(function () { longPressed = true; commentSheet(el.dataset.unit, el.dataset.stage); }, 550);
});
['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { document.addEventListener(ev, function () { clearTimeout(pressTimer); }); });
document.addEventListener('contextmenu', function (e) {
  var el = e.target.closest('.cell'); if (!el) return;
  e.preventDefault(); clearTimeout(pressTimer); longPressed = false; commentSheet(el.dataset.unit, el.dataset.stage);
});
document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(true); });
setInterval(function () { if (!document.hidden) refresh(true); }, 120000);
var lastWide = wide();
window.addEventListener('resize', function () { if (wide() !== lastWide) { lastWide = wide(); render(); } });

render();
if (B.__cached) refresh(true);   // opened from saved data: get the latest quietly

}
